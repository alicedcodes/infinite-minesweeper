<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="index, follow" />

    <!-- SEO -->
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESC%" />
    <meta name="keywords" content="minesweeper, infinite minesweeper" />
    <link rel="canonical" href="%VITE_APP_URL%" />
    <meta name="author" content="Alice Driscoll" />

    <!-- Open Graph / Social Media -->
    <meta property="og:site_name" content="%VITE_APP_TITLE%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESC%" />
    <meta property="og:image" content="%VITE_APP_URL%/preview.png" />
    <meta property="og:image:secure_url" content="%VITE_APP_URL%/preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ALT TEXT FOR PREVIEW IMAGE" />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/ico" sizes="any" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="menu-right" class="menu">
      <div>
        <button onclick="draw((IMS_DEV.State.zoom = 1))">1</button>
        <button onclick="draw((IMS_DEV.State.zoom /= 2))">/</button>
        <button onclick="draw((IMS_DEV.State.zoom *= 2))">*</button>
      </div>

      <button onclick="draw(IMS.restart())">Restart</button>
    </div>

    <canvas id="IMS">BROWSER DOES NOT SUPPORT HTML5 CANVAS</canvas>

    <noscript><div>BROWSER DOES NOT SUPPORT JAVASCRIPT</div></noscript>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const draw = () => IMS_DEV.Canvas.requestDraw();
    </script>
  </body>
</html>
